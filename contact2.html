<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact the Tech Club">
    <title>Contact - Tech Club</title>
    <link rel="icon" href="favicon.png" type="image/png">
</head>
<body>

    <header>
        <h1>Contact Us</h1>
        <nav>
            <a href="assignment3.html">Home</a> |
            <a href="about2.html">About</a> |
            <a href="register2.html">Register</a> |
            <a href="contact2.html">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Get in Touch</h2>
            <p>Email: techclub@example.com</p>
            <p>Location: College Computer Lab</p>
        </section>

        <section>
            <h2>Send a Message</h2>
            <form action="#" method="post">
                <p>
                    <label for="contact-name">Name:</label><br>
                    <input type="text" id="contact-name"
                           name="contact-name" required>
                </p>

                <p>
                    <label for="contact-email">Email:</label><br>
                    <input type="email" id="contact-email"
                           name="contact-email" required>
                </p>

                <p>
                    <label for="contact-message">Message:</label><br>
                    <textarea id="contact-message" name="message"
                              rows="5" cols="35" required></textarea>
                </p>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Tech Club</p>
    </footer>

</body>
</html>
